name: Ample
description: Ample Foods is a nutrition company that makes single-serving meal-replacement shakes
  sold direct-to-consumer at amplemeal.com. Its lineup includes Ample Original, a low-carb meal
  shake with roughly 25g protein and 4g net carbs per 400-calorie serving, and Ample Recover, a
  higher-carb performance shake with about 31g protein and 33g carbs per 400-calorie serving, sold
  in ready-to-drink bottles and bulk canisters. Ample is a consumer packaged-goods brand running on
  a Shopify storefront; enrichment probing found no public developer API, OpenAPI specification, SDK,
  developer portal, or API reference. This profile is a portfolio lead backed by 500 Global and is
  retained as a company record with no API surface to enrich.
